<head>

<body>

<div id="login-root" hidden></div>

<div class="shell" id="app" hidden>
  <nav class="sidebar" aria-label="Primary">
    <a class="brand" href="#/overview">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="11" fill="#3448F0"></rect><circle cx="17" cy="17" r="8" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="38 12.3" transform="rotate(-50 17 17)"></circle><circle cx="23.1" cy="11.9" r="2.4" fill="#FFFFFF"></circle></svg>
      <span style="display: flex; flex-direction: column">
        <span class="brand-name">SafeLoop <span>AI</span></span>
        <span class="brand-sub">Unit 100</span>
      </span>
    </a>
    <div class="nav-group" id="nav-main"></div>
    <div class="nav-group" id="nav-gov"></div>
    <div class="sidebar-foot">
      <div class="advisory">
        <div class="advisory-title">

        </div>
        <p>No path to DCS, PLC or SIS. Scores are indicative, for engineering review.</p>

      </button>
    </div>
  </nav>

  <main class="main">
    <header class="page-header">
      <div class="page-title">
        <h1 id="page-title">SafeLoop AI</h1>
        <p id="page-subtitle"></p>
      </div>
      <div id="replay-root"></div>
    </header>
    <div id="view" class="stack" aria-live="polite"></div>
  </main>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
